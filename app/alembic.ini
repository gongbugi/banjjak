[alembic]
script_location = migrations
# ASCII only: Windows reads .ini with the locale code page (cp949).
# The DB URL comes from the DATABASE_URL env var (see migrations/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
