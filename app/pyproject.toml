[project]
name = "banjjak"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "jinja2>=3.1",
    "slack_sdk>=3.45",   # 운영 AI의 Slack 버튼 (Socket Mode, 자체 웹소켓 클라이언트라 다른 의존성 없음)
    "anthropic==2.3.0",  # 운영 AI 진단(#20). 테이프 측정과 실시간이 같은 판으로 돌게 정확히 고정
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["banjjak"]

[tool.setuptools.package-data]
banjjak = ["templates/*.html"]
