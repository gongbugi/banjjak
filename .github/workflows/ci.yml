name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: app}
    services:
      # 테스트는 진짜 PostgreSQL로 (운영과 같은 18)
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: banjjak_test}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: k8s 매니페스트 렌더
        working-directory: .
        run: kubectl kustomize deploy/k8s > /dev/null

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      # 서버는 Azure x86(B2als v2) → amd64만 만든다
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gongbugi/banjjak:latest
            ghcr.io/gongbugi/banjjak:${{ github.sha }}
