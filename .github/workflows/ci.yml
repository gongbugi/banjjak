name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: app}
    services:
      # 테스트는 진짜 PostgreSQL로 (운영과 같은 18)
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: banjjak_test}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: k8s 매니페스트 렌더
        working-directory: .
        run: for d in deploy/k8s deploy/agent deploy/ops deploy/clusters/*/; do kubectl kustomize "$d" > /dev/null; done

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 경보 규칙을 가짜 시계열로 시험하고, 두 Prometheus 설정의 문법을 본다 (운영과 같은 버전의 promtool)
      - run: |
          promtool() { docker run --rm -v "$PWD/deploy:/d" -w /d --entrypoint promtool prom/prometheus:v3.13.4 "$@"; }
          promtool test rules ops/rules_test.yml
          promtool check config ops/prometheus.yml
          promtool check config --agent agent/agent.yml

  image:
    needs: [test, rules]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      # 서버는 Azure x86(B2als v2) → amd64만 만든다
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gongbugi/banjjak:latest
            ghcr.io/gongbugi/banjjak:${{ github.sha }}
