# 운영 AI(운영 VM)가 이 클러스터를 읽는 계정. banjjak 네임스페이스의 파드 · 로그 · 배포 · Job만 읽는다.
# Secret · 쓰기 · 다른 네임스페이스(장애 주입 포함)는 없다 → deploy/check-opsai-rbac.sh로 확인
# 토큰은 운영 VM의 Secret app-cluster로 옮긴다 (infra/azure/opsai-secrets.ps1). 조치 권한은 #8에서 허용 목록만 더한다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-ai
automountServiceAccountToken: false   # 이 클러스터의 파드가 쓰는 계정이 아니다
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-ai-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-ai-read
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ops-ai-read}
subjects:
  - {kind: ServiceAccount, name: ops-ai, namespace: banjjak}
---
# 오래 가는 토큰 (값은 클러스터가 채운다). 다른 VM에서 쓰므로 파드에 붙는 짧은 토큰으로는 안 된다
apiVersion: v1
kind: Secret
metadata:
  name: ops-ai-token
  annotations:
    kubernetes.io/service-account.name: ops-ai
type: kubernetes.io/service-account-token
