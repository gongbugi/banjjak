# 분석기(code-v1): 매시 20분. 수집(정각)이 끝난 뒤의 순위를 본다. LLM 없이 README를 규칙으로 읽는다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: analyzer
spec:
  schedule: "20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: analyzer
              image: banjjak
              imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다
              command: ["python", "-m", "banjjak.analyze"]
              env:
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: db, key: url}}
                - name: GITHUB_TOKEN
                  valueFrom: {secretKeyRef: {name: github-token, key: token}}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
