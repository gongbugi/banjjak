# 분석기: 매시 20분. 수집(정각)이 끝난 뒤의 순위를 본다. README를 규칙으로 읽고(코드판), 키가 있으면 Haiku가 카드를 다듬는다(#19).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: analyzer
spec:
  schedule: "20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: analyzer
              image: banjjak
              imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다
              command: ["python", "-m", "banjjak.analyze"]
              env:
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: db, key: url}}
                - name: GITHUB_TOKEN
                  valueFrom: {secretKeyRef: {name: github-token, key: token}}
                - name: HEARTBEAT_URL      # 밖(Better Stack)에 "돌았다"를 알린다. 없으면(로컬) 안 보낸다
                  valueFrom: {secretKeyRef: {name: heartbeats, key: analyzer, optional: true}}
                - name: ANTHROPIC_API_KEY  # 카드 AI 전용 키 (infra/azure/anthropic-key.ps1). 없으면(로컬) 코드판 카드만 만든다
                  valueFrom: {secretKeyRef: {name: anthropic, key: api_key, optional: true}}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
