apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # 스키마는 Alembic으로만 바꾼다 (앱이 알아서 고치지 않는다)
        - name: migrate
          image: banjjak
          imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다. latest 때 붙은 Always가 남지 않게 명시
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db, key: url}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: banjjak
          imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다. latest 때 붙은 Always가 남지 않게 명시
          ports:
            - containerPort: 8000
            - {name: metrics, containerPort: 9100}   # 수집기는 이 이름의 포트만 긁는다. Service에는 넣지 않는다
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db, key: url}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}   # DB 확인은 여기서만
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}  # 프로세스 생존만
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8000
---
# 주소(도메인)는 미뤘다 → 호스트 없이 서버 IP로 받는다 (k3s 기본 Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 80}}
