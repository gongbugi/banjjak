apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  # replicas는 두지 않는다: HPA(아래)가 정한다. 여기 두면 배포(apply)마다 1로 되돌린다
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # 스키마는 Alembic으로만 바꾼다 (앱이 알아서 고치지 않는다)
        - name: migrate
          image: banjjak
          imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다. latest 때 붙은 Always가 남지 않게 명시
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db, key: url}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: banjjak
          imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다. latest 때 붙은 Always가 남지 않게 명시
          ports:
            - containerPort: 8000
            - {name: metrics, containerPort: 9100}   # 수집기는 이 이름의 포트만 긁는다. Service에는 넣지 않는다
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db, key: url}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}   # DB 확인은 여기서만
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}  # 프로세스 생존만
            periodSeconds: 20
          lifecycle:
            # 파드가 꺼질 때 k8s는 엔드포인트에서 빼기와 SIGTERM을 동시에 한다. 입구(Traefik)는 1~2초 늦게 알아서
            # 그 사이 요청이 이미 닫힌 옛 파드로 가 502가 났다 (2026-10-22 재현: 교체 1번에 502 5~6건 · 끊김 1건,
            # 모두 SIGTERM 뒤 0~4.5초). 10초 더 받다가 끝낸다 → deploy/check-rollout.sh로 확인
            preStop:
              sleep: {seconds: 10}
          resources:
            # CPU 375m: HPA 기준(70%)이 포화의 약 절반에서 걸리게. #11 1차 측정 포화 계단 웹 CPU 535m × 0.7 (측정 전에 정한 규칙)
            requests: {cpu: 375m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: fault, mountPath: /etc/fault, readOnly: true}
      volumes:
        - name: fault                  # 장애 주입 스위치 (#10). 웹이 요청마다 /etc/fault/fault.json을 읽는다 (바뀌면 1분 안에 들어온다)
          configMap: {name: web-fault, optional: true}
---
# 급증 때 웹 파드를 2개까지 (#11). VM이 2 vCPU이고 uvicorn 프로세스 하나는 코어 하나만 쓴다 → 2가 천장
# 기준은 CPU 요청값 대비 사용률이다. 요청값 375m은 #11 1차 측정(포화 때 웹 CPU)에서 정했다 (Deployment 쪽 주석)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8000
---
# 요청 제한 (#11): 2차 공급 측정 초당 400건 × 0.8. 넘으면 입구(Traefik)가 429로 거절한다 → 웹이 죽지 않는다
# burst 320 (1초치): 기본값 1이면 몇 밀리초 안에 둘만 와도 거절될 수 있다
# 출처 기준 = Host 헤더: Traefik에는 "전체 하나" 설정이 없다. 주소(도메인)가 없어 모든 요청의 Host가 같은 IP라 사실상 통 하나
# ponytail: Host 헤더를 바꿔 보내면 다른 통으로 빠져나간다. 막으려면 주소를 정하고 다른 Host는 거절한다
# Traefik이 하나라 메모리 안에서 센다 (여럿이면 Redis가 필요하다)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
spec:
  rateLimit:
    average: 320
    period: 1s
    burst: 320
    sourceCriterion:
      requestHost: true
---
# 주소(도메인)는 미뤘다 → 호스트 없이 서버 IP로 받는다 (k3s 기본 Traefik). 화면 · 그 밖의 모든 주소는 요청 제한을 지난다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: banjjak-ratelimit@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 80}}
---
# 확인용 주소는 요청 제한 밖 (Better Stack · 준비 검사). 급증 때 밖의 감시가 "다운"으로 알리면 장애 주입의 정답이 샌다
# Traefik은 규칙이 긴 쪽을 먼저 본다 → 정확한 경로가 위 "/"보다 앞선다
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-checks
spec:
  rules:
    - http:
        paths:
          - {path: /healthz, pathType: Exact, backend: {service: {name: web, port: {number: 80}}}}
          - {path: /readyz, pathType: Exact, backend: {service: {name: web, port: {number: 80}}}}
          - {path: /freshness, pathType: Exact, backend: {service: {name: web, port: {number: 80}}}}
