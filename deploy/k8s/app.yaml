apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # 스키마는 Alembic으로만 바꾼다 (앱이 알아서 고치지 않는다)
        - name: migrate
          image: banjjak
          imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다. latest 때 붙은 Always가 남지 않게 명시
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db, key: url}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: banjjak
          imagePullPolicy: IfNotPresent   # 태그는 커밋 SHA라 바뀌지 않는다. latest 때 붙은 Always가 남지 않게 명시
          ports:
            - containerPort: 8000
            - {name: metrics, containerPort: 9100}   # 수집기는 이 이름의 포트만 긁는다. Service에는 넣지 않는다
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: db, key: url}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}   # DB 확인은 여기서만
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}  # 프로세스 생존만
            periodSeconds: 20
          lifecycle:
            # 파드가 꺼질 때 k8s는 엔드포인트에서 빼기와 SIGTERM을 동시에 한다. 입구(Traefik)는 1~2초 늦게 알아서
            # 그 사이 요청이 이미 닫힌 옛 파드로 가 502가 났다 (2026-10-22 재현: 교체 1번에 502 5~6건 · 끊김 1건,
            # 모두 SIGTERM 뒤 0~4.5초). 10초 더 받다가 끝낸다 → deploy/check-rollout.sh로 확인
            preStop:
              sleep: {seconds: 10}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: fault, mountPath: /etc/fault, readOnly: true}
      volumes:
        - name: fault                  # 장애 주입 스위치 (#10). 웹이 요청마다 /etc/fault/fault.json을 읽는다 (바뀌면 1분 안에 들어온다)
          configMap: {name: web-fault, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8000
---
# 주소(도메인)는 미뤘다 → 호스트 없이 서버 IP로 받는다 (k3s 기본 Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 80}}
