apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 로컬은 VM이 하나라 운영 쪽(관측 · 알림 · 운영 AI)도 같은 클러스터에 올린다. Grafana는 뺀다
resources:
  - ../../k8s
  - ../../agent
  - ../../ops
  - ../../opsai
configMapGenerator:
  - name: agent-target
    namespace: agent
    behavior: replace
    literals: [url=http://prometheus.observe.svc:9090/api/v1/write]
  - name: ops-ai-env
    namespace: ops-ai
    behavior: replace
    literals: [cluster=local-k3d]
  - name: observe-env
    namespace: observe
    behavior: replace
    literals: [cluster=local-k3d]
  - name: probe-target          # 로컬은 VM이 하나라 클러스터 안 입구(Traefik)로 부른다
    namespace: observe
    behavior: replace
    literals: [url=http://traefik.kube-system.svc]
