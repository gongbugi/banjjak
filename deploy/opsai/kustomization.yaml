apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ops-ai
resources:
  - opsai.yaml
configMapGenerator:
  # 보고에 밝히는 클러스터 이름 · 조치 실행 여부. 로컬은 deploy/clusters/k3d-banjjak에서 바꾼다 (같은 Slack 채널을 쓴다)
  # actions: Azure는 Slack 버튼(#8 2단계) 전까지 dry-run (쓰기 권한 deploy/opsai-act도 넣지 않는다)
  - name: ops-ai-env
    literals: [cluster=azure, actions=dry-run]
images:
  - name: banjjak
    newName: ghcr.io/gongbugi/banjjak
    newTag: latest   # 실제 배포는 deploy/apply.sh가 커밋 SHA로 고정한다
