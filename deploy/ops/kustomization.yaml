apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 관측 · 알림: Prometheus + Alertmanager. 클러스터별 묶음은 deploy/clusters/<context>
namespace: observe
resources:
  - namespace.yaml
  - prometheus.yaml
  - alertmanager.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, rules.yml]
  - name: alertmanager-config
    files: [alertmanager.yml, slack.tmpl]
  # 알림에 붙는 클러스터 이름. 로컬은 deploy/clusters/k3d-banjjak에서 바꾼다 (운영 AI의 ops-ai-env와 같은 값)
  - name: observe-env
    literals: [cluster=azure]
