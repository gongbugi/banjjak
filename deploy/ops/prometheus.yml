# 운영 VM의 Prometheus: 앱 클러스터 에이전트가 보낸 지표를 받아(remote write) 저장하고 SLI 규칙을 검사한다
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Alertmanager로 가는 알림에 붙는다 → Slack 제목의 [azure] · [local-k3d]. 값은 환경 변수 (Prometheus 3이 펼친다)
  # 이름이 cluster가 아닌 것은 앱 지표에 이미 cluster=app이 붙어 있어서다
  external_labels:
    site: ${CLUSTER_NAME}

rule_files: [rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

# 운영 클러스터에서 직접 긁는 것은 자기 자신뿐 (운영 AI는 #7에서 붙인다). 장애 주입기는 긁지 않는다
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
