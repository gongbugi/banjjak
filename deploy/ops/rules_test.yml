# promtool test rules rules_test.yml : 가짜 시계열로 규칙이 울리는 때와 안 울리는 때를 확인한다 (CI)
rule_files: [rules.yml]
evaluation_interval: 1m

tests:
  # 수집이 멈춰 나이가 1분에 60초씩 는다: 4분에 2시간을 넘고, 5분을 더 버틴 뒤 울린다
  - interval: 1m
    input_series:
      - series: 'banjjak_data_age_seconds{pod="web-a"}'
        values: '7000+60x20'
    alert_rule_test:
      - {eval_time: 3m, alertname: DataStale, exp_alerts: []}
      - {eval_time: 8m, alertname: DataStale, exp_alerts: []}
      - eval_time: 10m
        alertname: DataStale
        exp_alerts:
          - exp_annotations: {summary: 마지막 수집 기록이 2시간보다 오래됐다}
      - {eval_time: 10m, alertname: DataAgeMissing, exp_alerts: []}

  # 지표 자체가 없다 (웹 · 에이전트 · 앱 VM이 멈춤)
  - interval: 1m
    input_series:
      - series: 'up{job="prometheus"}'
        values: '1x20'
    alert_rule_test:
      - {eval_time: 9m, alertname: DataAgeMissing, exp_alerts: []}
      - eval_time: 11m
        alertname: DataAgeMissing
        exp_alerts:
          - exp_annotations: {summary: 데이터 나이 지표가 10분째 들어오지 않는다}
      - {eval_time: 11m, alertname: AnalysisSuccessLow, exp_alerts: []}   # 분석 지표가 아직 없으면 울리지 않는다

  # 화면 요청 70개 중 10개가 500. /healthz의 200 수천 개가 섞여도 비율이 희석되지 않아야 울린다
  - interval: 1m
    input_series:
      - series: 'banjjak_http_request_duration_seconds_count{route="/", method="GET", status="200"}'
        values: '0+60x20'
      - series: 'banjjak_http_request_duration_seconds_count{route="/", method="GET", status="500"}'
        values: '0+10x20'
      - series: 'banjjak_http_request_duration_seconds_count{route="/healthz", method="GET", status="200"}'
        values: '0+5000x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: WebErrorRateHigh
        exp_alerts:
          - exp_annotations: {summary: 웹 5xx 비율이 5분째 5%를 넘는다}

  # 화면 요청의 절반이 0.5~1초 → p95가 500ms를 넘는다. 빠른 /healthz는 섞이지 않는다
  - interval: 1m
    input_series:
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/", le="0.5"}'
        values: '0+50x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/", le="1"}'
        values: '0+100x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/", le="+Inf"}'
        values: '0+100x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/healthz", le="0.5"}'
        values: '0+5000x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/healthz", le="1"}'
        values: '0+5000x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/healthz", le="+Inf"}'
        values: '0+5000x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: WebLatencyP95High
        exp_alerts:
          - exp_annotations: {summary: 웹 p95가 5분째 500ms를 넘는다}

  # 화면 요청이 모두 0.25초 안: 울리지 않는다
  - interval: 1m
    input_series:
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/", le="0.25"}'
        values: '0+100x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/", le="0.5"}'
        values: '0+100x20'
      - series: 'banjjak_http_request_duration_seconds_bucket{route="/", le="+Inf"}'
        values: '0+100x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: WebLatencyP95High, exp_alerts: []}

  # 최근 24시간 성공률 90%
  - interval: 1m
    input_series:
      - series: 'banjjak_analysis_success_ratio{pod="web-a"}'
        values: '0.9x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AnalysisSuccessLow
        exp_alerts:
          - exp_annotations: {summary: 최근 24시간 분석 성공률이 95% 아래다}

  # Watchdog은 아무 지표가 없어도 늘 울린다
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_annotations: {summary: 경보 길이 살아 있다 (늘 울린다)}

  # 입구(Traefik)가 요청 제한으로 429를 낸다 (#11): 초당 10건 중 2건 거절 → 2분 창 + 2분 지속 뒤 울린다
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="200", method="GET", protocol="http"}'
        values: '0+600x20'
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="429", method="GET", protocol="http"}'
        values: '0+120x20'
    alert_rule_test:
      - {eval_time: 2m, alertname: WebRequestsRejected, exp_alerts: []}   # 아직 2분을 못 버팀
      - eval_time: 5m
        alertname: WebRequestsRejected
        exp_alerts:
          - exp_annotations: {summary: 입구가 요청 제한으로 거절(429)한 비율이 2분째 1%를 넘는다}
      - {eval_time: 5m, alertname: EntranceErrorsHigh, exp_alerts: []}   # 429는 웹이 못 닿은 게 아니다

  # 거절 3%: 1% 기준이라 울린다 (5%로 느슨해지면 이 시험이 잡는다)
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="200", method="GET", protocol="http"}'
        values: '0+600x20'
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="429", method="GET", protocol="http"}'
        values: '0+18x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: WebRequestsRejected
        exp_alerts:
          - exp_annotations: {summary: 입구가 요청 제한으로 거절(429)한 비율이 2분째 1%를 넘는다}

  # 거절이 0.5%뿐 (순간 몰림): 울리지 않는다
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="200", method="GET", protocol="http"}'
        values: '0+600x20'
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="429", method="GET", protocol="http"}'
        values: '0+3x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: WebRequestsRejected, exp_alerts: []}

  # 웹이 죽어 입구가 502 · 503을 낸다 (10-24 1차 측정: 3분 동안 응답 없음, 경보 0). 웹 지표에는 안 잡히는 오류
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="200", method="GET", protocol="http"}'
        values: '0+60x20'
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="502", method="GET", protocol="http"}'
        values: '0+20x20'
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="503", method="GET", protocol="http"}'
        values: '0+10x20'
    alert_rule_test:
      - {eval_time: 2m, alertname: EntranceErrorsHigh, exp_alerts: []}
      - eval_time: 5m
        alertname: EntranceErrorsHigh
        exp_alerts:
          - exp_annotations: {summary: 입구가 낸 502 · 503 · 504 비율이 2분째 5%를 넘는다 (웹이 응답하지 못한다)}

  # 스캐너의 404가 아무리 많아도 입구 오류가 아니다
  - interval: 1m
    input_series:
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="200", method="GET", protocol="http"}'
        values: '0+60x20'
      - series: 'traefik_entrypoint_requests_total{entrypoint="web", code="404", method="GET", protocol="http"}'
        values: '0+600x20'
    alert_rule_test:
      - {eval_time: 10m, alertname: EntranceErrorsHigh, exp_alerts: []}
      - {eval_time: 10m, alertname: WebRequestsRejected, exp_alerts: []}
