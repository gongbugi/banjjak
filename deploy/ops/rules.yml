# SLI 규칙. 목표값과 근거는 스펙 #1 (웹 p95 500ms · 신선도 2시간 · 분석 성공률 95% · 가용성 99%)
groups:
  - name: sli
    rules:
      # 사용자 화면(/ · /api/trending)만 센다. 확인용 주소(/healthz · /readyz · /freshness)를 넣으면 평소 숫자가 부푼다
      # 5%: 가용성 99%의 오류 예산(1%)을 5배 빠르게 쓰는 속도 (가정. 기준선 구간 실측으로 다시 본다)
      - alert: WebErrorRateHigh
        expr: |
          sum(rate(banjjak_http_request_duration_seconds_count{route=~"/|/api/trending", status=~"5.."}[5m]))
            / sum(rate(banjjak_http_request_duration_seconds_count{route=~"/|/api/trending"}[5m])) > 0.05
        for: 5m
        annotations:
          summary: 웹 5xx 비율이 5분째 5%를 넘는다

      - alert: WebLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(banjjak_http_request_duration_seconds_bucket{route=~"/|/api/trending"}[5m]))) > 0.5
        for: 5m
        annotations:
          summary: 웹 p95가 5분째 500ms를 넘는다

      # 수집이 한 번 빠지면 다음 수집이 도는 수십 초 동안 2시간을 살짝 넘는다 → for 5분이 그건 넘긴다
      - alert: DataStale
        expr: max(banjjak_data_age_seconds) > 7200
        for: 5m
        annotations:
          summary: 마지막 수집 기록이 2시간보다 오래됐다

      # 웹 · DB · 에이전트 · 앱 VM 중 무엇이 멈춰도 결국 여기로 온다 (CJONE에서 빠졌던 "수집기 자체 감시")
      - alert: DataAgeMissing
        expr: absent(banjjak_data_age_seconds)
        for: 10m
        annotations:
          summary: 데이터 나이 지표가 10분째 들어오지 않는다

      # #5 분석기가 채운다: 최근 24시간 성공 비율을 웹이 DB에서 잰다 (데이터 나이와 같은 방식). 지표가 없으면 울리지 않는다
      - alert: AnalysisSuccessLow
        expr: max(banjjak_analysis_success_ratio) < 0.95   # 파드마다 같은 DB 값이라 하나로 모은다
        for: 15m
        annotations:
          summary: 최근 24시간 분석 성공률이 95% 아래다

  # 경보 길 자체의 생존 신호 (Watchdog). 늘 울리고, Alertmanager가 Better Stack 하트비트로만 보낸다.
  # 이 신호가 끊기면 Prometheus 규칙 검사 · Alertmanager 보내기 · 운영 VM 중 하나가 멈춘 것이다
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        annotations:
          summary: 경보 길이 살아 있다 (늘 울린다)
