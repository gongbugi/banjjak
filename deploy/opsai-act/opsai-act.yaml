# 운영 AI 조치(쓰기) 권한: 조치 표(app/banjjak/actions.py)의 조치 · 대상 이름만. 실행을 켠 클러스터 묶음에만 넣는다.
# 로컬 k3d와 Azure 앱 VM (Azure는 2026-10-24 구간 2 시작부터). 넣지 않은 클러스터는 쓰기가 403 → 드라이런을 RBAC가 보장
# Job 생성 · Secret · 삭제 · 다른 이름(postgres 등)은 없다 → deploy/check-opsai-rbac.sh <ctx> execute로 확인
# RBAC는 이름까지. 롤백(배포 template 교체)으로 바꿀 수 있는 필드는 아래 승인 정책이 막는다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-ai-act
rules:
  - apiGroups: [apps]
    resources: [deployments]           # 롤백
    resourceNames: [web]
    verbs: [patch]
  # 레플리카(deployments/scale)는 없다: HPA가 맡는다 (#11, 2026-10-24 레플리카 조치를 조치 표에서 뺐다)
  - apiGroups: [batch]
    resources: [cronjobs]              # 멈춘 CronJob 재개
    resourceNames: [collector, analyzer]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-ai-act
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ops-ai-act}
subjects:
  - {kind: ServiceAccount, name: ops-ai, namespace: banjjak}
---
# RBAC는 대상 이름까지만 막는다. 이 정책이 API 서버에서 운영 AI 계정의 쓰기를 조치 표의 모양으로 좁힌다 (ops-ai 파드 코드와 무관)
# 롤백: 이 프로젝트 이미지로만, 계정 · 볼륨 · 실행 명령 · Secret 참조는 지금 그대로. 재개: suspend를 false로만
# 이 모양을 벗어나는 판으로는 되돌리지 못한다: 조치가 failed로 끝나고 사람이 본다
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ops-ai-act
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], operations: [UPDATE], resources: [deployments]}
      - {apiGroups: [batch], apiVersions: [v1], operations: [UPDATE], resources: [cronjobs]}
  matchConditions:
    - name: ops-ai-only
      expression: request.userInfo.username == 'system:serviceaccount:banjjak:ops-ai'
  variables:
    - name: new
      expression: object.spec.template.spec
    - name: old
      expression: oldObject.spec.template.spec
    # 파드 쪽 바뀌면 안 되는 칸 (이미지 · 평문 환경 변수 · 자원 · 검사는 판마다 다를 수 있다)
    - name: pods
      expression: >-
        [variables.new, variables.old].map(p, {
          'account': dyn(p.?serviceAccountName.orValue('')),
          'security': dyn(p.?securityContext.orValue({})),
          'volumes': dyn(p.?volumes.orValue([])),
          'host': dyn([p.?hostNetwork.orValue(false), p.?hostPID.orValue(false), p.?hostIPC.orValue(false)]),
          'containers': dyn((p.containers + p.?initContainers.orValue([])).map(c, {
            'name': dyn(c.name),
            'command': dyn(c.?command.orValue([])),
            'args': dyn(c.?args.orValue([])),
            'envFrom': dyn(c.?envFrom.orValue([])),
            'mounts': dyn(c.?volumeMounts.orValue([])),
            'security': dyn(c.?securityContext.orValue({})),
            'secrets': dyn(c.?env.orValue([]).filter(e, has(e.valueFrom)))}))})
  validations:
    - expression: >-
        object.kind != 'CronJob' || (object.spec.suspend == false
          && object.spec.schedule == oldObject.spec.schedule && object.spec.jobTemplate == oldObject.spec.jobTemplate)
      message: 재개는 suspend를 false로 바꾸기만 한다
    - expression: >-
        object.kind != 'Deployment' || (variables.new.containers + variables.new.?initContainers.orValue([]))
          .all(c, c.image.matches('^(ghcr[.]io/gongbugi/)?banjjak:[^/]+$'))
      message: 롤백은 이 프로젝트 이미지로만 한다
    - expression: >-
        object.kind != 'Deployment' || (object.spec.replicas == oldObject.spec.replicas && variables.pods[0] == variables.pods[1])
      message: 롤백은 계정 · 볼륨 · 실행 명령 · Secret 참조를 바꾸지 않는다
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ops-ai-act
spec:
  policyName: ops-ai-act
  validationActions: [Deny]
