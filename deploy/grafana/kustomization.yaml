apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 운영 VM에만 올린다 (로컬 시험에는 안 올린다). 먼저 Secret grafana-admin이 있어야 뜬다 → infra/azure/grafana-admin.ps1
namespace: observe
resources:
  - grafana.yaml
configMapGenerator:
  - name: grafana-datasources
    files: [datasource.yml]
  - name: grafana-dashboards
    files: [dashboards.yml, banjjak.json]
